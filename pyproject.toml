[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conformal-ops"
version = "0.1.0"
description = "Online Conformal Prediction for Optimization — DICA and beyond"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Chandra Sekhar Dronavajjala", email = "sekhar.dronavajjala@gmail.com"}]
dependencies = ["numpy>=1.21", "scipy>=1.7"]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0", "matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/chandrad/conformal-ops"
Paper = "https://proceedings.mlr.press/v340/"
